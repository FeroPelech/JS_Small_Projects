<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Css changer</title>
  </head>
  <body>
    <div class="container">
      <h1>Change CSS with sliders!</h1>
      <span class="heading">JS</span>
      <div class="css-controller">
        <label for="base">Base color</label>
        <input type="color" name="base" id="base" value="#ff0000" />
        <label for="width">Width</label>
        <input
          type="range"
          name="width"
          id="width"
          min="0"
          max="100"
          value="50"
          data-sizing="%"
        />
        <label for="border">Border radius</label>
        <input
          type="range"
          name="border"
          id="border"
          min="0"
          max="100"
          value="5"
          data-sizing="px"
        />
        <label for="blur">Padding</label>
        <input
          type="range"
          name="blur"
          id="blur"
          min="0"
          max="25"
          value="0"
          data-sizing="px"
        />
      </div>
      <img src="\CSS_Changer\picture\NiceOne.jpg" alt="ArsenalGun" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
