<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Code Editor</title>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <div class="box">
          <label for="html-code">HTML</label>
          <textarea id="html-code" onkeyup="run()"></textarea>
        </div>
        <div class="box">
          <label for="css-code">CSS</label>
          <textarea id="css-code" onkeyup="run()"></textarea>
        </div>
        <div class="box">
          <label for="js-code">JS</label>
          <textarea id="js-code" onkeyup="run()"></textarea>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
