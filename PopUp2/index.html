<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>PopUp2</title>
  </head>
  <body>
    <!-- <a class="button" onclick="toggleNewsLetter()">Subscribe Us</a> -->
    <div class="hidden" id="newsLetter">
      <h2>Join Our Exclusive News Letter</h2>
      <p>Follow my dark way to the absolut power!</p>
      <div class="box">
        <input type="email" placeholder="Enter Email" />
      </div>
      <div class="box">
        <button type="submit">Sign Up!</button>
      </div>
      <a class="close" onclick="toggleNewsLetter()">
        <i class="fa fa-times fa-2x" aria-hidden="true"></i>
      </a>
    </div>
    <script src="script.js"></script>
  </body>
</html>
